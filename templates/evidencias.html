<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKEL - Expertos en Proyectos de Educación Superior</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .layout-split { display: flex; flex: 1; overflow: hidden; }
        .left-panel { width: 350px; background: var(--white); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .right-panel { flex: 1; padding: 30px; overflow-y: auto; background: var(--secondary-bg); }
        
        .factor-header { padding: 15px 20px; font-weight: 600; background: #f8fafc; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-size: 0.95rem; }
        .char-item { padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
        .char-item:hover { background: #f1f5f9; }
        .char-item.active { background: #eef2ff; border-left: 3px solid var(--primary-color); }
        .char-title { font-weight: 600; color: var(--text-main); font-size: 0.95rem; margin-bottom: 5px; }
        .char-progress { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-muted); }
        .progress-bar { flex: 1; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0%; transition: 0.3s; }

        .aspect-card { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); margin-bottom: 25px; }
        .aspect-card h4 { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .evidence-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .evidence-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; }
        .evidence-name { font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .evidence-meta { font-size: 0.8rem; color: var(--text-muted); }
        
        .status { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status.aprobado { background: #d1fae5; color: #065f46; }
        .status.revision { background: #fef3c7; color: #92400e; }
        
        .upload-area { margin-top: 15px; border: 2px dashed var(--border-color); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; background: #fafafa; }
        .upload-area:hover { border-color: var(--primary-color); background: #f5f7ff; }
        .upload-area p { margin: 10px 0 0; font-size: 0.9rem; color: var(--text-muted); }
        .upload-area svg { color: var(--primary-color); }
        
        input[type="file"] { display: none; }
        
        /* Data Grid Styles */
        .data-grid-container { background: white; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        .data-grid-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-grid-table th, .data-grid-table td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        .data-grid-table th { background: #f8fafc; font-weight: 600; font-size: 0.9rem; }
        .data-grid-table input, .data-grid-table select { width: 100%; padding: 6px; border: 1px solid transparent; border-radius: 4px; box-sizing: border-box; }
        .data-grid-table input:focus, .data-grid-table select:focus { border-color: var(--primary-color); outline: none; background: #fffbfa; }
        .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="var(--primary-color)" stroke-width="2"/>
            </svg>
            SIACredit
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="sidebar-item">📊 Dashboard</a>
            <a href="evidencias.html" class="sidebar-item active">📁 Evidencias</a>
            <a href="autoevaluacion.html" class="sidebar-item">📝 Autoevaluación</a>
            <a href="informes.html" class="sidebar-item">📄 Informes</a>
            <a href="estadisticas.html" class="sidebar-item">📈 Estadísticas</a>
            <a href="configuracion.html" class="sidebar-item">⚙️ Configuración</a>
        </div>
        <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <a href="javascript:void(0)" onclick="logout()" class="sidebar-item" style="color: #ef4444; border:none; background:none;">🚪 Cerrar Sesión</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div><h2 style="font-size: 1.25rem; margin: 0;">Gestión de Evidencias (Modelo Acuerdo 01/2025)</h2></div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button id="themeToggle" class="btn-ghost" style="padding: 5px 10px; font-size: 1.2rem;" title="Cambiar Tema">🌓</button>
                <div id="userInfo" style="font-weight: 500;"></div>
            </div>
        </header>

        <div class="layout-split fade-in">
            <div class="left-panel" id="sidebarFactors"></div>
            <div class="right-panel" id="aspectsContainer"></div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='data.js') }}"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('siac_user')) || { email: 'invitado', role: 'guest' };
        
        // UI Fix for role display
        const roleLabel = user.role ? user.role.toUpperCase() : 'INVITADO';
        document.getElementById('userInfo').innerHTML = `<span>${user.email}</span> <span class="status ${user.role === 'admin' || user.role === 'inst_admin' ? 'aprobado' : 'revision'}" style="margin-left:10px">${roleLabel}</span>`;

        function logout() {
            localStorage.removeItem('siac_user');
            window.location.href = 'login.html';
        }

        async function renderSidebar() {
            const container = document.getElementById('sidebarFactors');
            const model = getDataModel();
            let html = '';
            if (model.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">No hay factores configurados.</div>';
                return;
            }
            // FILTRADO POR ROL: Líder solo ve sus factores asignados
            const filteredModel = model.filter(f => {
                if (user.role === 'admin' || user.role === 'inst_admin') return true;
                return f.leader_id == user.id;
            });

            if (filteredModel.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center;">No tienes factores asignados.</div>';
                return;
            }

            filteredModel.forEach(factor => {
                html += `<div class="factor-header">Factor ${factor.number}: ${factor.name}</div>`;
                factor.characteristics.forEach(char => {
                    html += `<div class="char-item" onclick="loadAspects('${char.id}')" id="char_tab_${char.id}">
                        <div class="char-title">${char.number} ${char.name}</div>
                        <div class="char-progress"><span>Ver aspectos y evidencias</span></div>
                    </div>`;
                });
                
                if (factor.number == 3 || String(factor.name).toLowerCase().includes('profesores')) {
                    html += `<div class="char-item" onclick="loadFactorDataGrid('${factor.id}')" id="char_tab_data_${factor.id}">
                        <div class="char-title">📊 Cuadros de Datos (Profesores)</div>
                        <div class="char-progress"><span>Ver métricas y plantillas</span></div>
                    </div>`;
                }
            });
            container.innerHTML = html;
        }

        async function loadAspects(charId) {
            document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
            const tab = document.getElementById(`char_tab_${charId}`);
            if (tab) tab.classList.add('active');

            const container = document.getElementById('aspectsContainer');
            const model = getDataModel();
            const response = await fetch(`/api/evidences?inst_id=${getInstId()}&program_id=${getProgramId()}`);
            const evidences = await response.json();
            
            let characteristic = null;
            model.forEach(f => {
                const found = f.characteristics.find(c => c.id === charId);
                if (found) characteristic = found;
            });
            if(!characteristic) return;

            let html = `<h2 style="margin-bottom: 25px;">Característica ${characteristic.number}: ${characteristic.name}</h2>`;
            characteristic.aspects.forEach((aspect, index) => {
                const aspectEvidences = evidences.filter(ev => ev.aspect_id === aspect.id);
                let evHtml = '<div class="evidence-list">';
                aspectEvidences.forEach(ev => {
                    evHtml += `<div class="evidence-item">
                        <div>
                            <div class="evidence-name" style="flex-wrap: wrap;">
                                📄 ${ev.name}
                                <div style="margin-left: 10px; display: inline-flex; gap: 5px;">
                                    <button onclick="viewFile('${ev.file_url}', '${ev.name}')" class="btn-ghost" style="padding: 2px 8px; font-size: 0.8rem; border: 1px solid var(--border-color); border-radius: 4px;" title="Ver archivo">👁️ Ver</button>
                                    <button onclick="forceDownload('${ev.file_url}', '${ev.name}')" class="btn-ghost" style="padding: 2px 8px; font-size: 0.8rem; border: 1px solid var(--border-color); border-radius: 4px;" title="Descargar archivo">⬇️ Descargar</button>
                                </div>
                            </div>
                            <div class="evidence-meta">Periodo: <b>${ev.period || 'N/A'}</b> | Por: ${ev.user_email} | Dept: ${ev.dependency}</div>
                        </div>
                        <div style="display:flex; gap:10px; align-items:center">
                            <span class="status ${ev.status}">${ev.status.toUpperCase()}</span>
                            <button onclick="updateStatus(${ev.id}, 'aprobado')" class="btn-ghost" style="color:green; border:1px solid green; padding:2px 5px; font-size:0.7rem;">Aprobar</button>
                            <button onclick="updateStatus(${ev.id}, 'rechazado')" class="btn-ghost" style="color:orange; border:1px solid orange; padding:2px 5px; font-size:0.7rem;">Rechazar</button>
                            <button onclick="deleteEvidence(${ev.id})" class="btn-ghost" style="color:red; border:1px solid red; padding:2px 5px; font-size:0.7rem;">Eliminar</button>
                        </div>
                    </div>`;
                });
                evHtml += '</div>';

                html += `<div class="aspect-card">
                    <h4>Aspecto ${index + 1}: ${aspect.text}</h4>
                    <div class="form-group" style="margin-bottom:15px;">
                        <label style="font-size:0.8rem;">Periodo Académico</label>
                        <select id="evidencePeriod_${aspect.id}" style="width:100%; padding:5px; border-radius:4px; border:1px solid #ddd;">
                            <option value="2025-1">2025-1</option>
                            <option value="2024-2">2024-2</option>
                            <option value="2024-1">2024-1</option>
                            <option value="2023-2">2023-2</option>
                            <option value="2023-1">2023-1</option>
                        </select>
                    </div>
                    ${evHtml}
                    <label class="upload-area">
                        <input type="file" onchange="uploadEvidence(this, '${aspect.id}')">
                        <p>Haz clic para subir evidencia técnica</p>
                    </label>
                </div>`;
            });
            container.innerHTML = html;
        }

        let chartFormacion = null;
        let chartHistorico = null;

        async function loadFactorDataGrid(factorId) {
            document.querySelectorAll('.char-item').forEach(el => el.classList.remove('active'));
            const tab = document.getElementById(`char_tab_data_${factorId}`);
            if (tab) tab.classList.add('active');

            const container = document.getElementById('aspectsContainer');
            
            let html = `
                <h2 style="margin-bottom: 25px;">📊 Cuadros de Datos del Factor 4: Profesores</h2>
                
                <div style="display:flex; justify-content:flex-end; margin-bottom:15px;">
                    <button class="btn-primary" onclick="saveFactor4Data()">💾 Guardar Todos los Cuadros</button>
                </div>
                
                <div class="data-grid-container fade-in">
                    <h3>Cuadro 1: Plantilla de Profesores</h3>
                    <p style="font-size:0.85rem; color:#666; margin-bottom:10px;">Ingrese la lista de profesores y sus características principales. El Cuadro 2 se actualizará basado en esto.</p>
                    <table class="data-grid-table" id="tablaProfesores">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Dedicación</th>
                                <th>Vinculación</th>
                                <th>Nivel de Formación</th>
                                <th>Años Exp.</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                    <button class="btn-ghost" style="margin-top:10px; border:1px dashed var(--primary-color); color:var(--primary-color);" onclick="addRowProfesores()">+ Agregar Profesor</button>
                </div>

                <div class="data-grid-container fade-in">
                    <h3>Cuadro 2: Consolidado Nivel de Formación vs Dedicación</h3>
                    <div class="chart-container" style="height:300px;">
                        <canvas id="chartFormacionDedicacion"></canvas>
                    </div>
                </div>

                <div class="data-grid-container fade-in">
                    <h3>Cuadro 3: Histórico de Profesores por Período</h3>
                    <table class="data-grid-table" id="tablaHistorico">
                        <thead>
                            <tr>
                                <th>Período</th>
                                <th>Total Profesores</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <button class="btn-ghost" style="margin-top:10px; border:1px dashed var(--primary-color); color:var(--primary-color);" onclick="addRowHistorico()">+ Agregar Período</button>
                    
                    <div class="chart-container" style="height:300px; margin-top:20px;">
                        <canvas id="chartHistorico"></canvas>
                    </div>
                </div>

                <div class="data-grid-container fade-in">
                    <h3>Cuadro 4: Capacitación Docente</h3>
                    <table class="data-grid-table" id="tablaCapacitacion">
                        <thead>
                            <tr>
                                <th>Período</th>
                                <th>Nombre Capacitación</th>
                                <th>Tipo</th>
                                <th>Asistentes</th>
                                <th>Duración (Horas)</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <button class="btn-ghost" style="margin-top:10px; border:1px dashed var(--primary-color); color:var(--primary-color);" onclick="addRowCapacitacion()">+ Agregar Capacitación</button>
                </div>

                <div class="data-grid-container fade-in">
                    <h3>Cuadro 5: Resultados Evaluación Docente</h3>
                    <table class="data-grid-table" id="tablaEvaluacion">
                        <thead>
                            <tr>
                                <th>Período</th>
                                <th>Profesor Evaluado</th>
                                <th>Calificación</th>
                                <th>Nivel Desempeño</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <button class="btn-ghost" style="margin-top:10px; border:1px dashed var(--primary-color); color:var(--primary-color);" onclick="addRowEvaluacion()">+ Agregar Evaluación</button>
                </div>
            `;
            container.innerHTML = html;
            
            await fetchFactor4Data();
        }

        function addRowProfesores(data = {nombre:'', dedicacion:'TC', vinculacion:'Planta', formacion:'Especialización', exp:''}) {
            const tbody = document.querySelector('#tablaProfesores tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = \`
                <td><input type="text" value="\${data.nombre}" placeholder="Nombre completo" onchange="updateFactor4Charts()"></td>
                <td>
                    <select onchange="updateFactor4Charts()">
                        <option value="TC" \${data.dedicacion==='TC'?'selected':''}>Tiempo Completo</option>
                        <option value="MT" \${data.dedicacion==='MT'?'selected':''}>Medio Tiempo</option>
                        <option value="HC" \${data.dedicacion==='HC'?'selected':''}>Hora Cátedra</option>
                    </select>
                </td>
                <td>
                    <select>
                        <option value="Planta" \${data.vinculacion==='Planta'?'selected':''}>Planta</option>
                        <option value="Ocasional" \${data.vinculacion==='Ocasional'?'selected':''}>Ocasional</option>
                        <option value="Catedrático" \${data.vinculacion==='Catedrático'?'selected':''}>Catedrático</option>
                    </select>
                </td>
                <td>
                    <select onchange="updateFactor4Charts()">
                        <option value="Pregrado" \${data.formacion==='Pregrado'?'selected':''}>Pregrado</option>
                        <option value="Especialización" \${data.formacion==='Especialización'?'selected':''}>Especialización</option>
                        <option value="Maestría" \${data.formacion==='Maestría'?'selected':''}>Maestría</option>
                        <option value="Doctorado" \${data.formacion==='Doctorado'?'selected':''}>Doctorado</option>
                    </select>
                </td>
                <td><input type="number" value="\${data.exp}" placeholder="Años"></td>
                <td style="text-align:center;"><button class="btn-ghost" style="color:red;" onclick="this.closest('tr').remove(); updateFactor4Charts();">X</button></td>
            \`;
            tbody.appendChild(tr);
            updateFactor4Charts();
        }

        function addRowHistorico(data = {periodo:'', total:0}) {
            const tbody = document.querySelector('#tablaHistorico tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = \`
                <td><input type="text" value="\${data.periodo}" placeholder="Ej. 2023-1" onchange="updateFactor4Charts()"></td>
                <td><input type="number" value="\${data.total}" onchange="updateFactor4Charts()"></td>
                <td style="text-align:center;"><button class="btn-ghost" style="color:red;" onclick="this.closest('tr').remove(); updateFactor4Charts();">X</button></td>
            \`;
            tbody.appendChild(tr);
            updateFactor4Charts();
        }

        function addRowCapacitacion(data = {periodo:'', nombre:'', tipo:'', asistentes:0, horas:0}) {
            const tbody = document.querySelector('#tablaCapacitacion tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" value="${data.periodo}" placeholder="Ej. 2023-1"></td>
                <td><input type="text" value="${data.nombre}" placeholder="Nombre evento"></td>
                <td><input type="text" value="${data.tipo}" placeholder="Curso/Diplomado"></td>
                <td><input type="number" value="${data.asistentes}"></td>
                <td><input type="number" value="${data.horas}"></td>
                <td style="text-align:center;"><button class="btn-ghost" style="color:red;" onclick="this.closest('tr').remove();">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function addRowEvaluacion(data = {periodo:'', profesor:'', calificacion:0, nivel:''}) {
            const tbody = document.querySelector('#tablaEvaluacion tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" value="${data.periodo}" placeholder="Ej. 2023-1"></td>
                <td><input type="text" value="${data.profesor}" placeholder="Nombre profesor"></td>
                <td><input type="number" step="0.1" value="${data.calificacion}" placeholder="Puntaje"></td>
                <td><input type="text" value="${data.nivel}" placeholder="Ej. Excelente"></td>
                <td style="text-align:center;"><button class="btn-ghost" style="color:red;" onclick="this.closest('tr').remove();">X</button></td>
            `;
            tbody.appendChild(tr);
        }

        function extractFactor4Data() {
            const profesores = [];
            document.querySelectorAll('#tablaProfesores tbody tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input, select');
                profesores.push({
                    nombre: inputs[0].value,
                    dedicacion: inputs[1].value,
                    vinculacion: inputs[2].value,
                    formacion: inputs[3].value,
                    exp: inputs[4].value
                });
            });

            const historico = [];
            document.querySelectorAll('#tablaHistorico tbody tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                historico.push({
                    periodo: inputs[0].value,
                    total: inputs[1].value
                });
            });

            const capacitacion = [];
            document.querySelectorAll('#tablaCapacitacion tbody tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                capacitacion.push({
                    periodo: inputs[0].value,
                    nombre: inputs[1].value,
                    tipo: inputs[2].value,
                    asistentes: inputs[3].value,
                    horas: inputs[4].value
                });
            });

            const evaluacion = [];
            document.querySelectorAll('#tablaEvaluacion tbody tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                evaluacion.push({
                    periodo: inputs[0].value,
                    profesor: inputs[1].value,
                    calificacion: inputs[2].value,
                    nivel: inputs[3].value
                });
            });

            return { profesores, historico, capacitacion, evaluacion };
        }

        async function saveFactor4Data() {
            const data = extractFactor4Data();
            const payload = {
                table_id: 'factor4_profesores',
                data: data,
                inst_id: getInstId(),
                program_id: getProgramId()
            };
            
            const btn = document.querySelector('button[onclick="saveFactor4Data()"]');
            btn.textContent = 'Guardando...';
            
            try {
                const response = await fetch('/api/estadisticas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(response.ok) {
                    alert('Datos guardados correctamente.');
                } else {
                    alert('Error al guardar datos.');
                }
            } catch (err) {
                alert('Error de conexión.');
            }
            btn.textContent = '💾 Guardar Todos los Cuadros';
        }

        async function fetchFactor4Data() {
            try {
                const res = await fetch(\`/api/estadisticas?table_id=factor4_profesores&inst_id=\${getInstId()}&program_id=\${getProgramId()}\`);
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.data) {
                        const data = typeof json.data === 'string' ? JSON.parse(json.data) : json.data;
                        if (data.profesores && data.profesores.length > 0) {
                            data.profesores.forEach(p => addRowProfesores(p));
                        } else {
                            addRowProfesores();
                        }
                        
                        if (data.historico && data.historico.length > 0) {
                            data.historico.forEach(h => addRowHistorico(h));
                        } else {
                            addRowHistorico();
                        }
                        
                        if (data.capacitacion && data.capacitacion.length > 0) {
                            data.capacitacion.forEach(c => addRowCapacitacion(c));
                        } else {
                            addRowCapacitacion();
                        }
                        
                        if (data.evaluacion && data.evaluacion.length > 0) {
                            data.evaluacion.forEach(e => addRowEvaluacion(e));
                        } else {
                            addRowEvaluacion();
                        }
                        return;
                    }
                }
            } catch(e) {}
            // Si no hay datos, inicializamos vacios
            addRowProfesores();
            addRowHistorico();
            addRowCapacitacion();
            addRowEvaluacion();
        }

        function updateFactor4Charts() {
            const data = extractFactor4Data();
            
            // 1. Chart Formación vs Dedicación (Calculado de Tabla Profesores)
            const stats = { 'Pregrado': 0, 'Especialización': 0, 'Maestría': 0, 'Doctorado': 0 };
            data.profesores.forEach(p => {
                if (p.formacion && stats[p.formacion] !== undefined) {
                    stats[p.formacion]++;
                }
            });
            
            const ctxFormacion = document.getElementById('chartFormacionDedicacion');
            if (ctxFormacion) {
                if (chartFormacion) chartFormacion.destroy();
                chartFormacion = new Chart(ctxFormacion, {
                    type: 'doughnut',
                    data: {
                        labels: ['Pregrado', 'Especialización', 'Maestría', 'Doctorado'],
                        datasets: [{
                            data: [stats['Pregrado'], stats['Especialización'], stats['Maestría'], stats['Doctorado']],
                            backgroundColor: ['#94a3b8', '#3b82f6', '#8b5cf6', '#ec4899']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                });
            }

            // 2. Chart Histórico
            const ctxHistorico = document.getElementById('chartHistorico');
            if (ctxHistorico) {
                if (chartHistorico) chartHistorico.destroy();
                chartHistorico = new Chart(ctxHistorico, {
                    type: 'bar',
                    data: {
                        labels: data.historico.map(h => h.periodo || 'N/A'),
                        datasets: [{
                            label: 'Total Profesores',
                            data: data.historico.map(h => parseInt(h.total) || 0),
                            backgroundColor: '#6366f1'
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                });
            }
        }

        async function uploadEvidence(input, aspectId) {
            if(!input.files[0]) return;
            const originalHTML = input.parentElement.innerHTML;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            formData.append('aspect_id', aspectId);
            formData.append('period', document.getElementById(`evidencePeriod_${aspectId}`).value);
            formData.append('email', user.email);
            formData.append('inst_id', getInstId());
            formData.append('program_id', getProgramId());
            
            input.parentElement.innerHTML = '<span style="color:var(--primary-color)">⏳ Subiendo archivo...</span>';
            
            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await resp.json();
                
                if(resp.ok && result.status === 'success') {
                    loadAspects(document.querySelector('.char-item.active').id.replace('char_tab_', ''));
                } else {
                    alert('Error al subir: ' + (result.error || result.message || 'Desconocido'));
                    // Restaurar el botón para reintentar
                    loadAspects(document.querySelector('.char-item.active').id.replace('char_tab_', ''));
                }
            } catch (err) {
                alert('Error de conexión o servidor. Intenta de nuevo.');
                loadAspects(document.querySelector('.char-item.active').id.replace('char_tab_', ''));
            }
        }

        async function updateStatus(id, status) {
            await fetch(`/api/evidences/status?inst_id=${getInstId()}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            loadAspects(document.querySelector('.char-item.active').id.replace('char_tab_', ''));
        }

        async function deleteEvidence(id) {
            if(!confirm('¿Eliminar esta evidencia?')) return;
            const resp = await fetch(`/api/evidences/${id}?inst_id=${getInstId()}`, { method: 'DELETE' });
            if(resp.ok) loadAspects(document.querySelector('.char-item.active').id.replace('char_tab_', ''));
        }

        function viewFile(url, name) {
            var ext = (name || '').split('.').pop().toLowerCase();
            var previewable = ['pdf', 'jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'];
            var isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext);
            var isPdf = ext === 'pdf';

            if (isPdf || isImage) {
                // Show the viewer modal
                document.getElementById('viewerModal').style.display = 'flex';
                document.getElementById('viewerTitle').textContent = name;
                if (isPdf) {
                    document.getElementById('viewerContent').innerHTML =
                        `<div style="text-align:right; padding:10px; border-bottom:1px solid #eee; background:#f9fafb;">
                            <button onclick="forceDownload('${url}','${name}')" class="btn-ghost" style="padding: 4px 12px; font-size: 0.9rem; border: 1px solid var(--border-color); border-radius: 4px;" title="Descargar PDF">⬇️ Descargar PDF</button>
                        </div>
                        <iframe src="${url}" style="width:100%; height:calc(100% - 50px); border:none;"></iframe>`;
                } else {
                    // Image — show with a download button
                    document.getElementById('viewerContent').innerHTML =
                        `<div style="text-align:center; padding:20px;">
                            <img src="${url}" style="max-width:100%; max-height:80vh; border-radius:8px;">
                            <br>
                            <button onclick="forceDownload('${url}','${name}')" class="btn-primary" style="margin-top:14px; display:inline-block;">
                                ⬇️ Descargar ${name}
                            </button>
                        </div>`;
                }
            } else {
                // Non-previewable file (docx, xlsx, pptx, zip, etc.) — force download directly
                forceDownload(url, name);
            }
        }

        function forceDownload(url, name) {
            // Navigate to proxy — server returns Content-Disposition: attachment
            // Browser downloads the file without leaving the page
            window.location.href = '/api/download?url=' + encodeURIComponent(url) + '&name=' + encodeURIComponent(name);
        }


        async function init() {
            await loadDataFromAPI();
            renderSidebar();
            setTimeout(() => { if(document.querySelector('.char-item')) document.querySelector('.char-item').click(); }, 300);
        }
        init();

        function closeViewer() { document.getElementById('viewerModal').style.display = 'none'; }
    </script>

    <div id="viewerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; width:90%; height:95%; border-radius:8px; position:relative; display:flex; flex-direction:column;">
            <div style="padding:10px 20px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                <h3 id="viewerTitle" style="margin:0;">Visor</h3>
                <button onclick="closeViewer()" style="background:none; border:none; font-size:2rem; cursor:pointer;">&times;</button>
            </div>
            <div id="viewerContent" style="flex:1; overflow:auto;"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
