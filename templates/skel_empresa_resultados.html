<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Analíticos - SKEL HC 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --secondary-color: #1e293b;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .btn-back {
            background: var(--secondary-color);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #334155;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(0,0,0,0.2);
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .score-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
        }
        .score-high { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .score-med { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .score-low { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .comp-tag {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-bottom: 5px;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 style="margin:0; color:var(--primary-color);">Resultados de Evaluación</h1>
                <p style="margin:5px 0 0 0; color:#94a3b8;">Dashboard Analítico Organizacional</p>
            </div>
            <a href="/skel360/empresa/{{ empresa_id }}" class="btn-back">⬅ Volver al Dashboard</a>
        </div>

        <div class="card">
            <h3>Consolidado por Colaborador</h3>
            <table>
                <thead>
                    <tr>
                        <th>Colaborador</th>
                        <th>Promedio Global</th>
                        <th>Desglose por Competencias</th>
                    </tr>
                </thead>
                <tbody id="resultados-tbody">
                    <tr><td colspan="3" style="text-align:center;">Cargando resultados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const empresaId = "{{ empresa_id }}";
        
        function getScoreClass(score) {
            if(score >= 4.0) return 'score-high';
            if(score >= 3.0) return 'score-med';
            return 'score-low';
        }

        async function loadResultados() {
            try {
                const res = await fetch(`/api/skel360/empresa/${empresaId}/resultados`);
                const data = await res.json();
                const tbody = document.getElementById('resultados-tbody');
                
                if (data.status === 'success' && data.data.length > 0) {
                    tbody.innerHTML = '';
                    data.data.forEach(item => {
                        const tr = document.createElement('tr');
                        
                        let compsHtml = '';
                        for(const [cName, cScore] of Object.entries(item.competencias)) {
                            compsHtml += `<span class="comp-tag">${cName}: <strong>${cScore}</strong></span>`;
                        }
                        
                        tr.innerHTML = `
                            <td><strong>${item.colaborador_nombre}</strong></td>
                            <td><span class="score-badge ${getScoreClass(item.promedio_global)}">${item.promedio_global}</span></td>
                            <td>${compsHtml || '<em>Sin desglose</em>'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No hay resultados registrados aún.</td></tr>';
                }
            } catch(e) {
                console.error(e);
                document.getElementById('resultados-tbody').innerHTML = '<tr><td colspan="3" style="text-align:center;">Error al cargar resultados.</td></tr>';
            }
        }

        loadResultados();
    </script>
</body>
</html>
