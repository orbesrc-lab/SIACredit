<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKEL - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1e40af;
            --bg-deep: #020818;
            --card-bg: rgba(6, 16, 41, 0.85);
            --text-main: #f0f6ff;
            --text-muted: #6b8aad;
            --border: rgba(37, 99, 235, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, transparent 70%);
            z-index: 0;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.15) 0%, transparent 70%);
            z-index: 0;
            filter: blur(60px);
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo svg { 
            margin-bottom: 16px; 
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.45));
        }

        .logo h1 {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .logo h1 span { color: var(--primary); }

        .logo p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
        }

        .form-group input::placeholder { color: #475569; }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .btn-login:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-guest {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s ease;
        }

        .btn-guest:hover { 
            border-color: var(--primary); 
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .links {
            text-align: center;
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .links a:hover { color: var(--primary); }

        .links a.primary { 
            color: var(--primary); 
            font-weight: 600;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .login-card { margin: 20px; padding: 40px 24px; }
            .logo h1 { font-size: 1.75rem; }
        }

        /* Modal Styles */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 30px; width: 90%; max-width: 400px;
            text-align: center; color: white; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .modal h3 { margin-top: 0; margin-bottom: 15px; }
        .modal p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
        .modal .btn-close {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px;
        }
        .modal .btn-submit {
            background: var(--primary); border: none;
            color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo_skel.png') }}" alt="SKEL" style="max-height: 90px; width: auto; object-fit: contain;">
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Institucional</label>
                <input type="email" id="email" required placeholder="usuario@universidad.edu.co">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
            <button type="button" onclick="guestLogin()" class="btn-guest">Ingresar como Invitado (Lectura)</button>
        </form>
        <div class="links">
            <a href="registro.html" class="primary">¿No tienes cuenta? Regístrate aquí</a>
            <a href="#" onclick="document.getElementById('forgotModal').style.display='flex'">Olvidé mi contraseña</a>
            <a href="index.html">← Volver al inicio</a>
        </div>
    </div>

    <!-- Modal Recuperar Contraseña -->
    <div id="forgotModal" class="modal-overlay">
        <div class="modal">
            <h3>Recuperar Contraseña</h3>
            <p>Ingresa tu correo electrónico registrado y te enviaremos una nueva contraseña temporal.</p>
            <form id="forgotForm">
                <div class="form-group" style="text-align: left;">
                    <input type="email" id="forgotEmail" required placeholder="usuario@correo.com">
                </div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button type="button" class="btn-close" onclick="document.getElementById('forgotModal').style.display='none'">Cancelar</button>
                    <button type="submit" class="btn-submit" id="btnForgotSubmit">Enviar Nueva Clave</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check if already logged in and redirect to avoid re-login
        try {
            const loggedUser = JSON.parse(localStorage.getItem('siac_user'));
            if (loggedUser && loggedUser.role) {
                window.location.href = 'dashboard.html';
            }
        } catch(e) {
            console.error("Error in login init check:", e);
        }

        function guestLogin() {
            localStorage.setItem('siac_user', JSON.stringify({ email: 'invitado@siac.edu.co', role: 'operativo', inst_id: 0, program_id: 0 }));
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    if (result.user.name && result.user.name.includes('[ASPIRANTE]')) {
                        alert('Su cuenta y matrícula se encuentran en proceso de revisión por parte de la institución. Por favor, intente ingresar más tarde.');
                        return;
                    }
                    localStorage.setItem('siac_user', JSON.stringify(result.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión al servidor.');
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const btn = document.getElementById('btnForgotSubmit');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('Se ha enviado una nueva contraseña temporal a tu correo.');
                    document.getElementById('forgotModal').style.display='none';
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión al servidor.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Nueva Clave';
            }
        });
    </script>
</body>
</html>
