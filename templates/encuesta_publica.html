<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Autoevaluación - SKEL SIAC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            display: block;
            height: auto;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            overflow-y: auto;
            color: #1e293b;
        }
        .public-container {
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
        }
        .form-header-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 35px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 25px;
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }
        .question-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .question-card:hover {
            box-shadow: var(--shadow-md);
        }
        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        /* Premium Rating Stars */
        .rating-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-direction: row-reverse; /* For CSS-only hover effect */
        }
        .rating-star {
            display: none;
        }
        .rating-label {
            font-size: 2.2rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .rating-label:hover,
        .rating-label:hover ~ .rating-label,
        .rating-star:checked ~ .rating-label {
            color: #eab308; /* Gold Star */
            transform: scale(1.1);
        }
        .rating-label:active {
            transform: scale(0.9);
        }

        /* Radio Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option-input {
            display: none;
        }
        .option-input:checked + .option-label {
            background: #eff6ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .option-circle {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            margin-right: 12px;
            display: inline-block;
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }
        .option-input:checked + .option-label .option-circle {
            border-color: var(--primary-color);
        }
        .option-input:checked + .option-label .option-circle::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 8px; height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        /* Success Screen */
        .success-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 50px 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            text-align: center;
            display: none;
            animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.15);
        }

        /* Loading */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Likert Scale Styles */
        .likert-group {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        @media (max-width: 600px) {
            .likert-group {
                grid-template-columns: 1fr;
            }
        }
        .likert-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 6px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s ease;
            text-align: center;
        }
        .likert-item:hover {
            background: #f1f5f9;
        }
        .likert-input {
            display: none;
        }
        .likert-input:checked + .likert-item {
            background: #eff6ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .likert-value {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .likert-text {
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-muted);
        }
        .likert-input:checked + .likert-item .likert-text {
            color: var(--primary-color);
        }

        /* Boolean Styles */
        .bool-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .bool-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            background: #f8fafc;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .bool-item:hover {
            background: #f1f5f9;
        }
        .bool-input {
            display: none;
        }
        .bool-input:checked + .bool-item.si {
            background: #ecfdf5;
            border-color: #10b981;
            color: #047857;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .bool-input:checked + .bool-item.no {
            background: #fef2f2;
            border-color: #ef4444;
            color: #b91c1c;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        /* Checkbox List Styles */
        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #f8fafc;
        }
        .checkbox-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .checkbox-input {
            display: none;
        }
        .checkbox-input:checked + .checkbox-label {
            background: #faf5ff;
            border-color: #8b5cf6;
            color: #6d28d9;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        .checkbox-box {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            margin-right: 12px;
            display: inline-block;
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }
        .checkbox-input:checked + .checkbox-label .checkbox-box {
            border-color: #8b5cf6;
            background: #8b5cf6;
        }
        .checkbox-input:checked + .checkbox-label .checkbox-box::after {
            content: '✓';
            position: absolute;
            top: -2px; left: 3px;
            color: white;
            font-size: 0.8rem;
            font-weight: 900;
        }

        /* File Upload Styles */
        .file-upload-container {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 25px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .file-upload-container:hover {
            border-color: var(--primary-color);
            background: #f1f5f9;
        }
        .file-upload-input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .file-upload-icon {
            font-size: 2rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .file-upload-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }
        .file-upload-subtext {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .file-progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        .file-progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.2s;
        }
        .file-status {
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }
    </style>
<script src="/static/app.js"></script>
</head>
<body>
    <div class="public-container">
        <!-- FORMULARIO DE ENCUESTA -->
        <div id="surveyFormWrapper">
            <div class="form-header-card">
                <img id="inst_logo" src="" alt="Logo" style="height: 60px; max-width: 200px; margin: 0 auto 15px; display: none; object-fit: contain;">
                <h3 id="inst_name" style="font-size: 1.1rem; color: var(--text-muted); font-weight: 600; margin-bottom: 5px;">Cargando institución...</h3>
                <h1 id="survey_title" style="font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-bottom: 12px;">Cargando encuesta...</h1>
                <p id="survey_description" style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; max-width: 550px; margin: 0 auto;"></p>
                <div style="margin-top: 15px;">
                    <span id="survey_target" class="badge" style="background:#e0f2fe; color:#0369a1; text-transform: uppercase; font-weight: 700; font-size: 0.8rem; padding: 6px 12px;">Estudiantes</span>
                </div>
            </div>

            <form id="publicSurveyForm" onsubmit="submitResponse(event)">
                <div id="questionsList">
                    <!-- Preguntas inyectadas por JS -->
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button type="submit" class="btn-primary" id="submitBtn" style="padding: 14px 40px; font-size: 1.05rem; box-shadow: var(--shadow-lg);">
                        <span class="spinner" id="btnSpinner"></span>
                        <span id="btnText">Enviar Respuestas</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- PANTALLA DE ÉXITO -->
        <div class="success-card" id="successScreen">
            <div class="success-icon">✓</div>
            <h2 style="font-size: 1.8rem; font-weight: 700; color: #0f172a; margin-bottom: 10px;">¡Muchas Gracias!</h2>
            <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto 30px; line-height: 1.6;">
                Tus respuestas han sido registradas con éxito. Tu opinión es muy valiosa para los procesos de mejora continua y autoevaluación institucional.
            </p>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Desarrollado por <strong>SKEL Expertos en Educación Superior</strong></p>
        </div>
    </div>

    <script>
        // Obtener el ID de la encuesta por query string
        const urlParams = new URLSearchParams(window.location.search);
        const surveyId = urlParams.get('id');

        let surveyData = null;

        async function initForm() {
            if (!surveyId) {
                document.getElementById('survey_title').textContent = "Enlace Inválido";
                document.getElementById('survey_description').textContent = "No se proporcionó un ID de encuesta válido en la URL.";
                document.getElementById('publicSurveyForm').style.display = 'none';
                return;
            }

            try {
                const resp = await authFetch(`/api/surveys/${surveyId}`);
                if (!resp.ok) {
                    throw new Error("Encuesta no encontrada");
                }
                surveyData = await resp.json();
                
                // Cargar datos en la UI
                document.getElementById('survey_title').textContent = surveyData.title;
                document.getElementById('survey_description').textContent = surveyData.description || "Por favor, responda con sinceridad a cada una de las preguntas.";
                
                const targetBadge = document.getElementById('survey_target');
                targetBadge.textContent = surveyData.target;
                targetBadge.className = `badge target-${surveyData.target}`;

                // Cargar institución
                const instResp = await authFetch(`/api/institution?inst_id=${surveyData.inst_id || 1}`);
                const instData = await instResp.json();
                document.getElementById('inst_name').textContent = instData.name;
                if(instData.logo_url) {
                    const logoImg = document.getElementById('inst_logo');
                    logoImg.src = instData.logo_url;
                    logoImg.style.display = 'block';
                }

                renderQuestions();
            } catch (e) {
                console.error(e);
                document.getElementById('survey_title').textContent = "Encuesta No Disponible";
                document.getElementById('survey_description').textContent = "La encuesta solicitada no existe, ha sido eliminada o no se encuentra activa en este momento.";
                document.getElementById('publicSurveyForm').style.display = 'none';
            }
        }

        function renderQuestions() {
            const list = document.getElementById('questionsList');
            list.innerHTML = '';

            surveyData.questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.dataset.id = q.id;
                card.dataset.type = q.type;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${idx + 1}. ${q.text} <span style="color:var(--error-color)">*</span>`;
                card.appendChild(qText);

                if (q.type === 'rating') {
                    const ratingDiv = document.createElement('div');
                    ratingDiv.className = 'rating-container';
                    
                    // Render 5 stars in reverse order (5 to 1) for the CSS hover sibling selector logic
                    for (let i = 5; i >= 1; i--) {
                        ratingDiv.innerHTML += `
                            <input type="radio" name="q_${q.id}" id="star_${q.id}_${i}" value="${i}" class="rating-star" required>
                            <label for="star_${q.id}_${i}" class="rating-label">★</label>
                        `;
                    }
                    card.appendChild(ratingDiv);

                } else if (q.type === 'likert') {
                    const likertDiv = document.createElement('div');
                    likertDiv.className = 'likert-group';
                    
                    const likertLabels = {
                        1: "Totalmente en desacuerdo",
                        2: "En desacuerdo",
                        3: "Neutro",
                        4: "De acuerdo",
                        5: "Totalmente de acuerdo"
                    };

                    for (let i = 1; i <= 5; i++) {
                        likertDiv.innerHTML += `
                            <input type="radio" name="q_${q.id}" id="likert_${q.id}_${i}" value="${i}" class="likert-input" required>
                            <label for="likert_${q.id}_${i}" class="likert-item">
                                <span class="likert-value">${i}</span>
                                <span class="likert-text">${likertLabels[i]}</span>
                            </label>
                        `;
                    }
                    card.appendChild(likertDiv);

                } else if (q.type === 'boolean') {
                    const boolDiv = document.createElement('div');
                    boolDiv.className = 'bool-group';
                    boolDiv.innerHTML = `
                        <input type="radio" name="q_${q.id}" id="bool_${q.id}_si" value="Sí" class="bool-input" required>
                        <label for="bool_${q.id}_si" class="bool-item si">Sí</label>
                        
                        <input type="radio" name="q_${q.id}" id="bool_${q.id}_no" value="No" class="bool-input" required>
                        <label for="bool_${q.id}_no" class="bool-item no">No</label>
                    `;
                    card.appendChild(boolDiv);

                } else if (q.type === 'select') {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'options-list';
                    
                    q.options.forEach((opt, optIdx) => {
                        optionsDiv.innerHTML += `
                            <input type="radio" name="q_${q.id}" id="opt_${q.id}_${optIdx}" value="${opt}" class="option-input" required>
                            <label for="opt_${q.id}_${optIdx}" class="option-label">
                                <span class="option-circle"></span>
                                ${opt}
                            </label>
                        `;
                    });
                    card.appendChild(optionsDiv);

                } else if (q.type === 'checkbox') {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'checkbox-list';
                    
                    q.options.forEach((opt, optIdx) => {
                        optionsDiv.innerHTML += `
                            <input type="checkbox" name="q_${q.id}" id="chk_${q.id}_${optIdx}" value="${opt}" class="checkbox-input">
                            <label for="chk_${q.id}_${optIdx}" class="checkbox-label">
                                <span class="checkbox-box"></span>
                                ${opt}
                            </label>
                        `;
                    });
                    card.appendChild(optionsDiv);

                } else if (q.type === 'text') {
                    const textarea = document.createElement('textarea');
                    textarea.name = `q_${q.id}`;
                    textarea.rows = 4;
                    textarea.required = true;
                    textarea.placeholder = "Escribe tu respuesta aquí...";
                    textarea.style.width = '100%';
                    textarea.style.padding = '15px';
                    textarea.style.borderRadius = 'var(--radius-md)';
                    textarea.style.border = '1px solid var(--border-color)';
                    card.appendChild(textarea);

                } else if (q.type === 'file') {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-upload-container';
                    fileDiv.innerHTML = `
                        <div class="file-upload-icon">📤</div>
                        <div class="file-upload-text">Selecciona o arrastra un archivo de soporte</div>
                        <div class="file-upload-subtext">PDF, Word, Excel, Imagen (Máx. 10MB)</div>
                        <input type="file" class="file-upload-input" onchange="handleFileUpload(this, '${q.id}')" required>
                        <input type="hidden" name="q_${q.id}" class="file-url-input" required>
                        <div class="file-progress-bar">
                            <div class="file-progress-fill"></div>
                        </div>
                        <div class="file-status"></div>
                    `;
                    card.appendChild(fileDiv);
                }

                list.appendChild(card);
            });
        }

        async function handleFileUpload(inputElem, qId) {
            const file = inputElem.files[0];
            if (!file) return;

            const container = inputElem.closest('.file-upload-container');
            const progress = container.querySelector('.file-progress-bar');
            const progressFill = container.querySelector('.file-progress-fill');
            const status = container.querySelector('.file-status');
            const uploadIcon = container.querySelector('.file-upload-icon');
            const uploadText = container.querySelector('.file-upload-text');

            // Show progress and status
            progress.style.display = 'block';
            status.style.display = 'block';
            status.style.color = 'var(--text-muted)';
            status.textContent = 'Subiendo archivo...';
            progressFill.style.width = '10%';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('survey_id', surveyId);
            formData.append('inst_id', surveyData.inst_id || 1);
            formData.append('program_id', surveyData.program_id || 0);

            try {
                // Simulate progress
                const progInterval = setInterval(() => {
                    let w = parseInt(progressFill.style.width);
                    if (w < 85) {
                        progressFill.style.width = (w + 15) + '%';
                    }
                }, 150);

                const resp = await authFetch('/api/surveys/upload', {
                    method: 'POST',
                    body: formData
                });
                
                clearInterval(progInterval);
                const res = await resp.json();
                
                if (resp.ok && res.status === 'success') {
                    progressFill.style.width = '100%';
                    status.style.color = '#16a34a';
                    status.textContent = `✓ Archivo cargado con éxito: ${res.name}`;
                    
                    // Save the uploaded url to the hidden input
                    const hiddenInput = container.querySelector('.file-url-input');
                    hiddenInput.value = res.url;
                } else {
                    progressFill.style.width = '0%';
                    status.style.color = '#ef4444';
                    status.textContent = `❌ Error: ${res.error || 'Fallo al subir el archivo.'}`;
                }
            } catch (err) {
                console.error(err);
                progressFill.style.width = '0%';
                status.style.color = '#ef4444';
                status.textContent = '❌ Error de red al subir.';
            }
        }

        async function submitResponse(e) {
            e.preventDefault();

            // Disable submit button and show spinner
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            
            submitBtn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Enviando...';

            const answers = {};
            const qCards = document.querySelectorAll('.question-card');
            
            let allAnswered = true;
            qCards.forEach(card => {
                const qId = card.dataset.id;
                const qType = card.dataset.type;

                if (qType === 'rating' || qType === 'select' || qType === 'likert' || qType === 'boolean') {
                    const checkedOption = card.querySelector(`input[name="q_${qId}"]:checked`);
                    if (!checkedOption) {
                        allAnswered = false;
                        card.style.borderColor = 'var(--error-color)';
                    } else {
                        answers[qId] = checkedOption.value;
                        card.style.borderColor = 'var(--border-color)';
                    }
                } else if (qType === 'checkbox') {
                    const checkedCheckboxes = card.querySelectorAll(`input[name="q_${qId}"]:checked`);
                    if (checkedCheckboxes.length === 0) {
                        allAnswered = false;
                        card.style.borderColor = 'var(--error-color)';
                    } else {
                        const vals = Array.from(checkedCheckboxes).map(cb => cb.value);
                        answers[qId] = vals.join(', ');
                        card.style.borderColor = 'var(--border-color)';
                    }
                } else if (qType === 'text') {
                    const textVal = card.querySelector(`textarea[name="q_${qId}"]`).value.trim();
                    if (!textVal) {
                        allAnswered = false;
                        card.style.borderColor = 'var(--error-color)';
                    } else {
                        answers[qId] = textVal;
                        card.style.borderColor = 'var(--border-color)';
                    }
                } else if (qType === 'file') {
                    const fileUrl = card.querySelector(`input[name="q_${qId}"]`).value;
                    if (!fileUrl) {
                        allAnswered = false;
                        card.style.borderColor = 'var(--error-color)';
                    } else {
                        answers[qId] = fileUrl;
                        card.style.borderColor = 'var(--border-color)';
                    }
                }
            });

            if (!allAnswered) {
                alert("Por favor, responda a todas las preguntas requeridas y asegúrese de que la carga de archivos haya finalizado.");
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Enviar Respuestas';
                return;
            }

            // Detect if survey requires cloud upload based on storage config or default to sync if enabled
            // We can send use_cloud=true so the server saves to local and synchronizes to cloud if it has supabase set up
            const useCloudQuery = localStorage.getItem('siac_use_cloud') === 'true' ? 'true' : 'false';

            try {
                const resp = await authFetch(`/api/surveys/${surveyId}/respond?use_cloud=${useCloudQuery}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(answers)
                });
                
                const res = await resp.json();
                if (resp.ok && res.status === 'success') {
                    // Hide form and show success screen
                    document.getElementById('surveyFormWrapper').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("❌ Error: " + (res.error || "No se pudo registrar la respuesta."));
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Enviar Respuestas';
                }
            } catch (err) {
                console.error(err);
                alert("❌ Error de red. Comprueba tu conexión a internet.");
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Enviar Respuestas';
            }
        }

        window.onload = initForm;
    </script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const _u = JSON.parse(localStorage.getItem('siac_user') || '{}');
    const _r = _u.role || localStorage.getItem('user_role') || '';
    
    // Herramientas de super administrador
    const _adminOnly = ['admin', 'super_admin'];
    
    // CRM B2B link (dentro de Herramientas Gerenciales)
    const _crm = document.getElementById('menuCrm');
    if(_crm) _crm.style.display = _adminOnly.includes(_r) ? 'block' : 'none';
    
    // Capacitacion / Formacion
    const _cap = document.getElementById('menuCapacitacion');
    if(_cap) _cap.style.display = _adminOnly.includes(_r) ? 'block' : 'none';
    
    // Backup y Seguridad
    const _bk = document.getElementById('menuBackup');
    if(_bk) _bk.style.display = ['admin', 'super_admin', 'inst_admin', 'lider', 'empresa_admin'].includes(_r) ? 'block' : 'none';
    
    // Consultoria B2B section
    const _b2b = document.getElementById('menuConsultoriaB2B');
    if(_b2b) _b2b.style.display = ['admin', 'super_admin', 'empresa_admin'].includes(_r) ? 'block' : 'none';
});
</script>
